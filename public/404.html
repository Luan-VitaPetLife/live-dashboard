<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada — Coco and Luna</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<style>
  :root{ color-scheme:light;
    --side-bg:#111110;--side-text:#f0ebe0;--side-muted:#6b6760;--side-hover:rgba(240,235,224,0.06);--side-active:#1e1e1c;
    --bg:#ede8df;--surface:#faf8f4;--surface2:#f4f0e8;--border:rgba(30,28,24,0.10);--border2:rgba(30,28,24,0.16);
    --text:#1a1916;--sub:#6b6760;--muted:#9c9790;--ink:#2d2a26;--radius:10px;--radius-sm:6px; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{display:flex;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:13px;line-height:1.5}

  /* Sidebar: CSS do componente vive em sidebar.js (injetado). Aqui só o layout da página. */
  .main{margin-left:180px;flex:1;display:flex;flex-direction:column;min-height:100vh;transition:margin-left .25s cubic-bezier(.4,0,.2,1)}
  body.sidebar-hidden .main{margin-left:0}

  .err-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;gap:6px}
  .err-illustration{width:240px;max-width:70vw;margin-bottom:18px}
  .err-code{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
  .err-title{font-size:22px;font-weight:300;letter-spacing:-.5px;color:var(--text);margin-top:2px}
  .err-sub{font-size:13px;color:var(--sub);max-width:340px;margin-top:6px}
  .err-btn{margin-top:22px;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 20px;border-radius:20px;border:1px solid var(--border2);background:var(--surface);color:var(--text);font-size:13px;font-weight:600;text-decoration:none;transition:all .15s}
  .err-btn:hover{border-color:var(--ink);background:var(--surface2)}

  @media(max-width:768px){ .main{margin-left:0} }
</style>
</head>
<body>

<script src="sidebar.js"></script>
<script src="confirm-modal.js"></script>
<script src="jobs-widget.js"></script>

<div class="main">
  <div class="err-wrap">
    <img src="404.png" alt="" class="err-illustration">
    <div class="err-code">Erro 404</div>
    <div class="err-title">Essa página não existe</div>
    <div class="err-sub">O endereço pode ter mudado ou nunca existiu. Confira o link ou volte para uma das páginas do menu.</div>
    <a class="err-btn" href="/"><i class="bi bi-bar-chart-line"></i> Voltar para a Visão geral</a>
  </div>
</div>

</body>
</html>
