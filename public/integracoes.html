<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Integrações — Vita Pet Life</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="switch.css">
<style>
  :root{ color-scheme:light;
    --side-bg:#111110;--side-text:#f0ebe0;--side-muted:#6b6760;--side-hover:rgba(240,235,224,0.06);--side-active:#1e1e1c;
    --bg:#ede8df;--surface:#faf8f4;--surface2:#f4f0e8;--border:rgba(30,28,24,0.10);--border2:rgba(30,28,24,0.16);
    --text:#1a1916;--sub:#6b6760;--muted:#9c9790;--rust:#a05a3a;--sage:#6a8c6e;--ink:#2d2a26;
    --green:#3d7a52;--red:#9b3a3a;--amber:#9b7a2a;--radius:10px;--radius-sm:6px; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{display:flex;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:13px;line-height:1.5}

  /* Sidebar: CSS do componente vive em sidebar.js (injetado). Aqui só o layout da página. */
  body.sidebar-hidden .main{margin-left:64px}
  @media(max-width:768px){ .main{margin-left:0} .content{padding:16px} }

  /* ── Main ── */
  /* min-width:0 evita rolagem horizontal da página — ver CLAUDE.md "Padrões de UI
     compartilhados" (mesma regra repetida em todas as páginas, não centralizado). */
  .main{margin-left:180px;flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh;transition:margin-left .25s cubic-bezier(.4,0,.2,1)}

  /* ── Topbar ── */
  .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;height:54px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:100}
  .topbar-title{font-size:12px;font-weight:600;color:var(--sub);letter-spacing:.2px}
  .live-dot-wrap{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin-left:auto}
  .ldot{width:5px;height:5px;background:var(--sage);border-radius:50%;animation:blink 2s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

  /* ── Content — sem teto de largura: a tela inteira é aproveitada (ver pedido do Luan,
       05/08/2026). Antes tinha max-width:1600px sem margin:auto, então em telas largas o
       conteúdo ficava colado à esquerda com uma faixa de fundo vazia à direita. ── */
  .content{padding:28px;display:flex;flex-direction:column;gap:20px;flex:1;width:100%}
  .page-headrow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .page-title{font-size:22px;font-weight:300;letter-spacing:-.5px;line-height:1.1}
  .page-sub{font-size:12px;color:var(--muted);margin-top:3px}
  .back-link{font-size:11px;color:var(--sub);text-decoration:none;display:inline-flex;align-items:center;gap:5px}
  .back-link:hover{color:var(--text)}

  /* ── Seletor de modo de visualização ── */
  .view-switch{display:flex;gap:3px;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:3px;flex-shrink:0}
  .vs-btn{display:flex;align-items:center;gap:6px;padding:7px 12px;border:none;background:none;border-radius:7px;font-size:11px;font-weight:600;color:var(--sub);cursor:pointer;font-family:inherit;white-space:nowrap}
  .vs-btn:hover{color:var(--text)}
  .vs-btn.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}

  /* ── Retenção de histórico da Amazon (admin) ── */
  .ret-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;display:flex;flex-direction:column;gap:14px}
  .ret-panel-title{font-size:13px;font-weight:600}
  .ret-panel-sub{font-size:11px;color:var(--sub);margin-top:2px;line-height:1.5;max-width:640px}
  .ret-rows{display:flex;flex-direction:column;gap:8px}
  .ret-row{padding:10px 12px;background:var(--surface2);border-radius:var(--radius-sm)}
  .ret-row-main{display:flex;align-items:center;gap:14px}
  /* Altura fixa + largura livre, não caixa quadrada — mesmo motivo do .fam-head-logo acima:
     Amazon_logo.png é uma faixa larga (ícone+nome, ~3.5:1), não um ícone quadrado; forçar
     20x20 deixava a logo minúscula com vão vazio ao redor (reportado pelo Luan, 19/08/2026). */
  .ret-row-logo{height:24px;width:auto;flex-shrink:0}
  .ret-row-label{font-size:12px;font-weight:600;width:170px;flex-shrink:0;display:flex;align-items:center;gap:10px}
  .ret-row-label-text{display:flex;flex-direction:column;gap:1px}
  .ret-row-sub{display:block;font-size:10px;font-weight:400;color:var(--muted);margin-top:2px}
  .ret-row-status{font-size:10px;color:var(--sub);margin-top:6px;min-height:12px}
  .ret-row-input{display:flex;align-items:center;gap:6px;margin-left:auto}
  .ret-row-input input[type=number]{width:64px;font-size:12px;font-family:inherit;color:var(--text);padding:6px 8px;border:1px solid var(--border2);border-radius:var(--radius-sm);background:var(--surface);outline:none;transition:border-color .12s}
  .ret-row-input input[type=number]:focus{border-color:var(--ink)}
  .ret-row-input span{font-size:11px;color:var(--sub)}
  .ret-btn{font-size:11px;font-weight:600;padding:8px 14px;background:var(--ink);color:var(--side-text);border:none;border-radius:var(--radius-sm);cursor:pointer;transition:opacity .12s;white-space:nowrap;font-family:inherit}
  .ret-btn:hover{opacity:.85}
  .ret-btn:disabled{opacity:.5;cursor:default}
  .ret-divider{height:1px;background:var(--border2)}
  .ret-backfill-status{font-size:11px;color:var(--sub);margin-top:8px;min-height:14px}
  .backup-file-row{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;font-size:11px;color:var(--sub);background:var(--surface2);border-radius:var(--radius-sm)}
  .backup-file-row+.backup-file-row{margin-top:4px}
  .backup-file-name{font-weight:600;color:var(--text)}

  /* ── País — espaçamento próprio acima/abaixo de cada bloco + divisor entre os países ── */
  .country-block{display:flex;flex-direction:column;gap:16px;padding:22px 0}
  .country-block+.country-block{border-top:1px solid var(--border2)}
  .country-block:first-of-type{padding-top:4px}
  .country-head{display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--border2)}
  .country-flag{width:22px;height:auto;border-radius:3px}
  .country-name{font-size:15px;font-weight:600}

  /* ── Logo genérico (canal solto ou cabeçalho de família) ── */
  .integ-logo,.fam-logo,.fam-head-logo,.compact-logo{border-radius:8px;border:1px solid var(--border2);background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
  .integ-logo{width:44px;height:44px}
  .integ-logo img{max-width:40px;max-height:40px;object-fit:contain}
  .integ-logo i{font-size:18px;color:var(--muted)}
  .fam-logo{width:32px;height:32px;border-radius:7px}
  .fam-logo img{max-width:22px;max-height:22px;object-fit:contain}
  .fam-logo i{font-size:14px;color:var(--muted)}

  .integ-name{font-size:13px;font-weight:600;color:var(--text)}
  .integ-note{font-size:11px;color:var(--sub);margin-top:2px;line-height:1.4}
  .integ-badge{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:20px;display:inline-block;width:fit-content}
  .badge-connected{background:rgba(61,122,82,.1);color:var(--green)}
  .badge-pending_auth{background:rgba(155,122,42,.1);color:var(--amber)}
  .badge-not_configured{background:var(--surface2);border:1px solid var(--border2);color:var(--muted)}
  .badge-paused{background:rgba(155,122,42,.1);color:var(--amber)}
  .badge-disabled{background:rgba(30,28,24,.08);color:var(--sub)}
  .badge-planned{background:var(--surface2);border:1px solid var(--border2);color:var(--muted)}

  /* ── Toggle switch: vem de switch.css (.ios-switch), padrão único do app ── */

  /* ── Bloco de família — a logo da PLATAFORMA (ex.: Shopify) fica DENTRO do card, no
       cabeçalho, ao lado da contagem de conectadas — sem repetir o nome em texto (os cards dos
       membros já dizem quem são: "Shopify - Coco and Luna BR", "Yucaloo BR"). Só é usado quando
       2+ integrações compartilham a mesma plataforma — uma integração sozinha aparece como card
       avulso, sem nenhum disso.
       Altura fixa + largura livre (não mais uma caixa quadrada): os logos de plataforma
       (Shopify_logo.png, Logotipo_MercadoLivre.png, Amazon_logo.png) são faixas bem largas
       (ícone + nome lado a lado, ~3.5:1), não ícones quadrados — numa caixa quadrada com
       object-fit:contain a imagem cabia pela LARGURA e sobrava um vão vazio enorme em cima e
       embaixo (reportado pelo Luan, print mostrando o espaço vazio). Deixando só a altura fixa
       e a largura seguir a proporção real de cada logo, o vão some sozinho — sem editar as
       imagens. ── */
  .fam-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px}
  .fam-head{display:flex;align-items:center;gap:14px}
  .fam-head-logo{height:44px;width:auto;border-radius:0;border:none;background:none;flex-shrink:0}
  .fam-head-logo img{height:100%;width:auto;display:block}
  .fam-head-logo i{font-size:22px;color:var(--muted)}
  .fam-count{font-size:10px;color:var(--muted);white-space:nowrap;margin-left:auto}
  .fam-cards{display:flex;flex-wrap:wrap;gap:12px}
  .fam-cards>.integ-card{background:var(--surface2);flex:1 1 240px}

  /* ── Card individual (canal avulso OU membro de uma família) ── */
  .integ-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px}
  .integ-card.is-planned{opacity:.6}
  .integ-top{display:flex;align-items:center;gap:12px}
  .integ-info{min-width:0;flex:1}
  .integ-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto}

  /* ── Modo Cards: family blocks ocupam a linha inteira, cards avulsos fluem lado a lado ── */
  .integ-flow{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
  .integ-flow>.integ-card{flex:1 1 260px}
  .integ-flow>.fam-block{flex:1 1 100%}

  /* ── Modo Colunas: grid de verdade (não masonry via CSS columns) — cada linha alinha pela
       altura do bloco mais alto dela. O masonry anterior (column-width) balanceava só a altura
       TOTAL de cada coluna, então cards avulsos sem relação nenhuma entre si (Shopee, Meta Ads)
       acabavam empilhados juntos numa coluna só pra fechar conta, ficando com um visual torto e
       sem alinhamento — reportado pelo Luan, 21/08/2026, com print. */
  .integ-columns{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;align-items:stretch}
  /* .fam-block já é flex-column (regra geral acima) — só falta o miolo (.fam-cards) crescer pra
     absorver a altura extra do stretch, puxando os cards-membro junto (align-items:stretch
     também vale dentro de .fam-cards, por padrão) em vez de sobrar vão em branco embaixo. */
  .integ-columns>.fam-block>.fam-cards{flex:1}

  /* ── Modo Linhas: lista compacta, um card por linha, tipo configurações ── */
  .integ-rows-wrap{display:flex;flex-direction:column;gap:12px}
  .integ-rows{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
  .rows-famhead{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--surface2);border-bottom:1px solid var(--border)}
  .rows-famhead .fam-logo{width:20px;height:20px;border-radius:5px}
  .rows-famhead .fam-logo img{max-width:14px;max-height:14px}
  .rows-famhead-name{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--sub)}
  .integ-row{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .integ-rows>.integ-row:last-child{border-bottom:none}
  .integ-row.is-planned{opacity:.55}
  .integ-row .integ-logo{width:30px;height:30px;border-radius:6px}
  .integ-row .integ-logo img{max-width:26px;max-height:26px}
  .integ-row-name{font-size:12.5px;font-weight:600;flex-shrink:0;width:210px}
  .integ-row-note{font-size:11px;color:var(--sub);flex:1;min-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .integ-row-sw{flex-shrink:0;margin-left:auto}

  /* ── Modo Compacto: grade densa de ícones — visão geral rápida, clique na bolinha de status
       liga/desliga direto (sem abrir o card inteiro) ── */
  .integ-compact-wrap{display:flex;flex-direction:column;gap:16px}
  .compact-famhead{display:flex;align-items:center;gap:6px;margin-bottom:2px}
  .compact-famhead .fam-logo{width:18px;height:18px;border-radius:4px}
  .compact-famhead .fam-logo img{max-width:12px;max-height:12px}
  .compact-famhead-name{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .compact-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
  .compact-tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative}
  .compact-tile.is-planned{opacity:.5}
  .compact-logo{width:34px;height:34px;border-radius:8px}
  .compact-logo img{max-width:30px;max-height:30px;object-fit:contain}
  .compact-logo i{font-size:15px;color:var(--muted)}
  .compact-name{font-size:10px;font-weight:600;line-height:1.25;max-height:2.6em;overflow:hidden;color:var(--text)}
  .compact-dot{width:9px;height:9px;border-radius:50%;position:absolute;top:7px;right:7px;border:1.5px solid var(--surface)}
  .compact-dot.clickable{cursor:pointer}
  .dot-connected{background:var(--green)}
  .dot-pending_auth{background:var(--amber)}
  .dot-not_configured{background:var(--muted)}
  .dot-paused{background:var(--amber)}
  .dot-disabled{background:var(--border2)}
  .dot-planned{background:var(--border2)}

  .empty{font-size:12px;color:var(--muted);padding:24px;text-align:center}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--side-text);font-size:12px;font-weight:600;padding:11px 20px;border-radius:20px;box-shadow:0 8px 28px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:all .25s;z-index:500}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:var(--red)}

  @media(max-width:768px){
    .integ-row-name{width:auto}
    .integ-columns{grid-template-columns:1fr}
  }
  @media(max-width:560px){
    .content{padding:20px 16px}
    .view-switch{width:100%}
    .vs-btn{flex:1;justify-content:center}
    .integ-flow>.integ-card,.fam-cards>.integ-card{flex-basis:100%}
    .compact-grid{grid-template-columns:repeat(auto-fill,minmax(78px,1fr))}
  }
</style>
</head>
<body>

<script src="sidebar.js"></script>
<script src="confirm-modal.js"></script>
<script src="jobs-widget.js"></script>

<div class="main">
  <div class="topbar">
    <span class="topbar-title">Configurações do sistema</span>
    <div class="live-dot-wrap"><div class="ldot"></div><span id="whoami">—</span></div>
  </div>

  <div class="content">
    <div class="page-headrow">
      <div>
        <a class="back-link" href="/configuracoes"><i class="bi bi-arrow-left"></i> Configurações</a>
        <div class="page-title" style="margin-top:8px">Integrações</div>
        <div class="page-sub">Vita Pet Life · status e controle de cada canal conectado</div>
      </div>
      <div class="view-switch" id="viewSwitch">
        <button type="button" class="vs-btn" data-mode="cards"><i class="bi bi-grid-3x3-gap"></i> Cards</button>
        <button type="button" class="vs-btn" data-mode="colunas"><i class="bi bi-layout-three-columns"></i> Colunas</button>
        <button type="button" class="vs-btn" data-mode="linhas"><i class="bi bi-list-ul"></i> Linhas</button>
        <button type="button" class="vs-btn" data-mode="compacto"><i class="bi bi-grid-1x2"></i> Compacto</button>
      </div>
    </div>

    <div class="ret-panel" id="retPanel">
      <div>
        <div class="ret-panel-title">Amazon — Histórico</div>
        <div class="ret-panel-sub" id="retPanelSub">Carregando…</div>
      </div>
      <div class="ret-rows" id="retRows"></div>
    </div>

    <div class="ret-panel" id="backupPanel">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px">
        <div>
          <div class="ret-panel-title">Backup do banco (Backblaze B2)</div>
          <div class="ret-panel-sub" id="backupPanelSub">Carregando…</div>
        </div>
        <button class="ret-btn" id="backupRunBtn" onclick="runBackupNow()">Fazer backup agora</button>
      </div>
      <div class="ret-backfill-status" id="backupStatusMsg"></div>
      <div class="ret-divider" id="backupFilesDivider" style="display:none"></div>
      <div id="backupFilesList"></div>
    </div>

    <div class="ret-panel" id="alertsPanel">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px">
        <div>
          <div class="ret-panel-title">Alerta de sincronização (Telegram)</div>
          <div class="ret-panel-sub" id="alertsPanelSub">Carregando…</div>
        </div>
        <button class="ret-btn" id="alertsTestBtn" onclick="testAlertNow()">Enviar teste</button>
      </div>
      <div class="ret-backfill-status" id="alertsStatusMsg"></div>
    </div>

    <div id="listArea">
      <div class="empty">Carregando integrações…</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const LOGO_BASE = 'logos-integracao/';
const FALLBACK_ICON = { geral: 'bi-shop', marketing: 'bi-megaphone', planned: 'bi-hourglass-split' };
const STATE_LABEL = {
  connected: 'Conectada', pending_auth: 'Aguardando autorização', not_configured: 'Não configurada',
  paused: 'Pausada', disabled: 'Desativada', planned: 'Em breve',
};
const COUNTRY_LABEL = { br: 'Brasil', us: 'Estados Unidos' };
const COUNTRY_FLAG  = { br: 'bandeira_brasil.webp', us: 'bandeira_eua.svg' };

// Metadados de cada PLATAFORMA (não confundir com o canal em si) — usados só pro cabeçalho do
// bloco de família, quando 2+ integrações do mesmo `group` aparecem juntas (ver server.js
// computeIntegrationsList). Logo do card individual continua sendo o da conta/marca (ex.: ícone
// da Coco and Luna no card Shopify BR) — aqui é o logo da plataforma em si.
const GROUP_ORDER = ['shopify','mercadolivre','amazon','shopee','meta','google','bling','tiktok'];
const GROUP_META = {
  shopify:      { label: 'Shopify',       logo: 'Shopify_logo.png' },
  mercadolivre: { label: 'Mercado Livre', logo: 'Logotipo_MercadoLivre.png' },
  amazon:       { label: 'Amazon',        logo: 'Amazon_logo.png' },
  shopee:       { label: 'Shopee',        logo: 'logo-shopee.png' },
  meta:         { label: 'Meta',          logo: 'logo-meta.png' },
  google:       { label: 'Google Ads',    logo: 'google_ads_logo_icon.png' },
  bling:        { label: 'Bling',         logo: 'logo-bling1.png' },
  tiktok:       { label: 'TikTok Shop',   logo: 'logo-tiktok-shop.png' },
};

let viewMode = localStorage.getItem('coco_integ_view') || 'cards';
let lastItems = [];

function toast(msg, isErr){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  setTimeout(()=>{ t.className = 'toast' + (isErr ? ' err' : ''); }, 2600);
}

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadMe(){
  try{
    const r = await fetch('/api/me', { credentials:'same-origin' });
    const d = await r.json();
    const uname = (d.user && (d.user.name || d.user.username)) || 'Admin';
    $('whoami').textContent = uname;
  }catch(e){}
}

// ── Ligar/desligar — compartilhado por todos os modos de visualização (switch nos modos Cards/
// Colunas/Linhas, clique na bolinha de status no modo Compacto). `revert` desfaz uma mudança
// visual otimista (hoje só o checkbox nativo, que já se marca sozinho antes do evento `change`
// disparar) se o usuário cancelar a confirmação ou a chamada falhar. ──
async function requestToggle(it, desired, revert){
  const question = desired
    ? 'Ativar ' + it.label + ' (' + COUNTRY_LABEL[it.country] + ')? A sincronização automática volta a rodar no próximo ciclo.'
    : 'Desativar ' + it.label + ' (' + COUNTRY_LABEL[it.country] + ')? A sincronização automática para de buscar dados novos desse canal. O que já está salvo continua no painel normalmente.';
  if (!(await cocoConfirm(question, { title: desired ? 'Ativar integração' : 'Desativar integração' }))){ if (revert) revert(); return; }
  try{
    const r = await fetch('/api/integrations/' + encodeURIComponent(it.key) + '/toggle', {
      method:'POST', credentials:'same-origin',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ enabled: desired }),
    });
    if (!r.ok){ const d = await r.json().catch(()=>({})); throw new Error(d.error || 'http ' + r.status); }
    toast(it.label + (desired ? ' ativada.' : ' desativada.'));
    load();
  }catch(e){
    if (revert) revert();
    toast('Erro ao salvar: ' + (e.message || 'falha de rede'), true);
  }
}

function makeSwitch(it){
  const sw = document.createElement('label');
  sw.className = 'ios-switch';
  sw.innerHTML = '<input type="checkbox" class="ios-switch-input" ' + (it.state !== 'disabled' ? 'checked' : '') + '>' +
    '<span class="ios-switch-track"><span class="ios-switch-thumb"></span></span>';
  const cb = sw.querySelector('input');
  cb.addEventListener('change', () => {
    const desired = cb.checked;
    cb.disabled = true;
    requestToggle(it, desired, () => { cb.checked = !desired; }).finally(() => { cb.disabled = false; });
  });
  return sw;
}

function logoBoxEl(className, logo, label, category){
  const box = document.createElement('div');
  box.className = className;
  const img = document.createElement('img');
  // Logo começando com "/" é servida direto da raiz de public/ (ex: /Logo2.png, o ícone da
  // própria Coco and Luna) em vez de logos-integracao/ — usado pros canais Shopify que são a
  // marca em si, não um serviço de terceiro (ver server.js computeIntegrationsList).
  img.src = (logo || '').startsWith('/') ? logo : LOGO_BASE + logo;
  img.alt = label;
  img.onerror = function(){
    box.innerHTML = '<i class="bi ' + (FALLBACK_ICON[category] || 'bi-app') + '"></i>';
  };
  box.appendChild(img);
  return box;
}

// ── Card individual (usado tanto pra canal avulso quanto pra membro dentro de um fam-block) ──
function integCardEl(it){
  const card = document.createElement('div');
  card.className = 'integ-card' + (it.state === 'planned' ? ' is-planned' : '');

  const top = document.createElement('div');
  top.className = 'integ-top';
  top.appendChild(logoBoxEl('integ-logo', it.logo, it.label, it.category));

  const info = document.createElement('div');
  info.className = 'integ-info';
  const noteText = it.note || it.detail || '';
  info.innerHTML =
    '<div class="integ-name">' + escapeHtml(it.label) + '</div>' +
    '<div class="integ-badge badge-' + it.state + '">' + STATE_LABEL[it.state] + '</div>' +
    (noteText ? '<div class="integ-note">' + escapeHtml(noteText) + '</div>' : '');
  top.appendChild(info);
  card.appendChild(top);

  if (it.state !== 'planned'){
    const bottom = document.createElement('div');
    bottom.className = 'integ-bottom';
    const label = document.createElement('span');
    label.className = 'integ-note';
    label.textContent = it.state === 'disabled' ? 'Sincronização pausada' : 'Sincronização automática';
    bottom.appendChild(label);
    bottom.appendChild(makeSwitch(it));
    card.appendChild(bottom);
  }

  return card;
}

// ── Bloco de família: a logo da plataforma fica grande, fora da caixa do card (só o ícone —
// sem repetir o nome em texto, os cards dos membros já dizem quem são); o card em si só tem a
// contagem de conectadas + os cards das contas daquela plataforma. ──
function famBlockEl(groupId, items){
  const meta = GROUP_META[groupId] || { label: groupId, logo: '' };
  const wrap = document.createElement('div');
  wrap.className = 'fam-block';

  const head = document.createElement('div');
  head.className = 'fam-head';
  head.appendChild(logoBoxEl('fam-head-logo', meta.logo, meta.label, 'geral'));
  const count = document.createElement('div');
  count.className = 'fam-count';
  const connected = items.filter(it => it.state === 'connected').length;
  count.textContent = connected + '/' + items.length + ' conectadas';
  head.appendChild(count);
  wrap.appendChild(head);

  const cardsWrap = document.createElement('div');
  cardsWrap.className = 'fam-cards';
  items.forEach(it => cardsWrap.appendChild(integCardEl(it)));
  wrap.appendChild(cardsWrap);

  return wrap;
}

// ── Agrupa por plataforma (`group`), preservando a ordem de GROUP_ORDER. Grupo com 2+ itens vira
// um fam-block; grupo com 1 item só aparece como card avulso (sem cabeçalho de família). ──
function buildBlocks(items){
  const byGroup = {};
  items.forEach(it => { (byGroup[it.group] ||= []).push(it); });
  const order = GROUP_ORDER.filter(g => byGroup[g]).concat(Object.keys(byGroup).filter(g => !GROUP_ORDER.includes(g)));
  return order.map(g => {
    const list = byGroup[g];
    return list.length > 1 ? { kind: 'family', group: g, items: list } : { kind: 'solo', item: list[0] };
  });
}

// ── Modos Cards/Colunas: mesmos elementos (fam-block / integ-card), só muda a classe do
// container — flex-wrap num, CSS multi-column no outro. ──
function renderFlowLikeMode(container, blocks, className){
  container.className = className;
  blocks.forEach(b => {
    container.appendChild(b.kind === 'family' ? famBlockEl(b.group, b.items) : integCardEl(b.item));
  });
}

// ── Modo Linhas: lista compacta, um bloco (com cabeçalho, se família) por grupo ──
function rowEl(it, isMember){
  const row = document.createElement('div');
  row.className = 'integ-row' + (it.state === 'planned' ? ' is-planned' : '');
  row.appendChild(logoBoxEl('integ-logo', it.logo, it.label, it.category));

  const name = document.createElement('div');
  name.className = 'integ-row-name';
  name.textContent = it.label;
  row.appendChild(name);

  const badge = document.createElement('div');
  badge.className = 'integ-badge badge-' + it.state;
  badge.textContent = STATE_LABEL[it.state];
  row.appendChild(badge);

  const note = document.createElement('div');
  note.className = 'integ-row-note';
  note.textContent = it.note || it.detail || '';
  row.appendChild(note);

  if (it.state !== 'planned'){
    const sw = makeSwitch(it);
    sw.classList.add('integ-row-sw');
    row.appendChild(sw);
  }
  return row;
}
function renderRowsMode(container, blocks){
  container.className = 'integ-rows-wrap';
  blocks.forEach(b => {
    const list = document.createElement('div');
    list.className = 'integ-rows';
    if (b.kind === 'family'){
      const meta = GROUP_META[b.group] || { label: b.group, logo: '' };
      const head = document.createElement('div');
      head.className = 'rows-famhead';
      head.appendChild(logoBoxEl('fam-logo', meta.logo, meta.label, 'geral'));
      const nm = document.createElement('span');
      nm.className = 'rows-famhead-name';
      nm.textContent = meta.label;
      head.appendChild(nm);
      list.appendChild(head);
      b.items.forEach(it => list.appendChild(rowEl(it, true)));
    } else {
      list.appendChild(rowEl(b.item, false));
    }
    container.appendChild(list);
  });
}

// ── Modo Compacto: grade densa de ícones — clique na bolinha de status liga/desliga direto,
// sem precisar abrir o card inteiro. Itens avulsos (sem família) ficam juntos numa grade final,
// sem cabeçalho, pra não criar uma grade de 1 ícone só pra cada um. ──
function compactTileEl(it){
  const tile = document.createElement('div');
  tile.className = 'compact-tile' + (it.state === 'planned' ? ' is-planned' : '');
  const noteText = it.note || it.detail || '';
  tile.title = it.label + ' — ' + STATE_LABEL[it.state] + (noteText ? ' · ' + noteText : '');
  tile.appendChild(logoBoxEl('compact-logo', it.logo, it.label, it.category));
  const name = document.createElement('div');
  name.className = 'compact-name';
  name.textContent = it.label;
  tile.appendChild(name);
  const dot = document.createElement('div');
  dot.className = 'compact-dot dot-' + it.state + (it.state === 'planned' ? '' : ' clickable');
  if (it.state !== 'planned'){
    dot.addEventListener('click', e => {
      e.stopPropagation();
      requestToggle(it, it.state === 'disabled', null);
    });
  }
  tile.appendChild(dot);
  return tile;
}
function renderCompactMode(container, blocks){
  container.className = 'integ-compact-wrap';
  const solo = [];
  blocks.forEach(b => {
    if (b.kind === 'family'){
      const meta = GROUP_META[b.group] || { label: b.group, logo: '' };
      const wrap = document.createElement('div');
      const head = document.createElement('div');
      head.className = 'compact-famhead';
      head.appendChild(logoBoxEl('fam-logo', meta.logo, meta.label, 'geral'));
      const nm = document.createElement('span');
      nm.className = 'compact-famhead-name';
      nm.textContent = meta.label;
      head.appendChild(nm);
      wrap.appendChild(head);
      const grid = document.createElement('div');
      grid.className = 'compact-grid';
      b.items.forEach(it => grid.appendChild(compactTileEl(it)));
      wrap.appendChild(grid);
      container.appendChild(wrap);
    } else {
      solo.push(b.item);
    }
  });
  if (solo.length){
    const wrap = document.createElement('div');
    const grid = document.createElement('div');
    grid.className = 'compact-grid';
    solo.forEach(it => grid.appendChild(compactTileEl(it)));
    wrap.appendChild(grid);
    container.appendChild(wrap);
  }
}

async function load(){
  try{
    const r = await fetch('/api/integrations', { credentials:'same-origin' });
    if (!r.ok) throw new Error('http ' + r.status);
    const d = await r.json();
    lastItems = d.integrations || [];
    render(lastItems);
  }catch(e){
    $('listArea').innerHTML = '<div class="empty">Não foi possível carregar as integrações.</div>';
  }
}

function render(items){
  const area = $('listArea');
  area.innerHTML = '';
  const countries = ['br', 'us'];
  countries.forEach(country => {
    const inCountry = items.filter(it => it.country === country);
    if (!inCountry.length) return;

    const block = document.createElement('div');
    block.className = 'country-block';

    const head = document.createElement('div');
    head.className = 'country-head';
    head.innerHTML =
      '<img src="' + COUNTRY_FLAG[country] + '" class="country-flag" alt="' + COUNTRY_LABEL[country] + '">' +
      '<span class="country-name">' + COUNTRY_LABEL[country] + '</span>';
    block.appendChild(head);

    const container = document.createElement('div');
    const blocks = buildBlocks(inCountry);
    if (viewMode === 'colunas') renderFlowLikeMode(container, blocks, 'integ-columns');
    else if (viewMode === 'linhas') renderRowsMode(container, blocks);
    else if (viewMode === 'compacto') renderCompactMode(container, blocks);
    else renderFlowLikeMode(container, blocks, 'integ-flow');
    block.appendChild(container);

    area.appendChild(block);
  });

  if (!area.children.length) area.innerHTML = '<div class="empty">Nenhuma integração encontrada.</div>';
}

function syncViewSwitch(){
  document.querySelectorAll('#viewSwitch .vs-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === viewMode));
}
$('viewSwitch').addEventListener('click', e => {
  const btn = e.target.closest('.vs-btn');
  if (!btn) return;
  viewMode = btn.dataset.mode;
  localStorage.setItem('coco_integ_view', viewMode);
  syncViewSwitch();
  if (lastItems.length) render(lastItems);
});

// ── Histórico da Amazon (BR/EUA separados) — um campo só por mercado ────
// "Dias de histórico desejado": se for menos do que já existe, poda (pede prévia + confirmação,
// só essa ação apaga pedido de verdade); se for mais, busca automaticamente o que falta
// (backfill, não precisa de confirmação — só soma). Nunca os dois separados, evita confundir
// "isso soma com aquilo?" (pergunta real do Luan, 18/08/2026). Ver server.js /api/amazon/history.
const RET_MARKET_LABEL = { br: 'BR', us: 'EUA' };
let retBackfillPolling = null;
function retCoverageText(info){
  if (info.oldestOrderDays === null) return 'nenhum pedido ainda';
  return `cobre ${info.oldestOrderDays.toLocaleString('pt-BR')} dias hoje`;
}
async function loadHistory(){
  try{
    const r = await fetch('/api/amazon/history', { credentials:'same-origin' });
    if (!r.ok) throw new Error('http ' + r.status);
    const d = await r.json();
    $('retPanelSub').textContent = 'Digite quantos dias de pedidos você quer manter guardados. Um número menor apaga o excesso (pede confirmação); um número maior busca na Amazon o que estiver faltando.';
    $('retRows').innerHTML = ['us','br'].map(mkt => {
      const info = d[mkt] || { days: 0, totalOrders: 0, oldestOrderDays: null };
      const cap = mkt === 'us' ? 'Us' : 'Br';
      return `<div class="ret-row">
        <div class="ret-row-main">
          <div class="ret-row-label"><img class="ret-row-logo" src="logos-integracao/Amazon_logo.png" alt=""><span class="ret-row-label-text">${RET_MARKET_LABEL[mkt]}<span class="ret-row-sub">${info.totalOrders.toLocaleString('pt-BR')} pedidos · ${retCoverageText(info)}</span></span></div>
          <div class="ret-row-input"><input type="number" id="retDays${cap}" min="0" value="${info.days}"><span>dias (0 = sem limite)</span></div>
          <button class="ret-btn" id="retApply${cap}" onclick="applyHistory('${mkt}')">Aplicar</button>
        </div>
        <div class="ret-row-status" id="retStatus${cap}"></div>
      </div>`;
    }).join('');
  }catch(e){
    $('retPanelSub').textContent = 'Não foi possível carregar o histórico da Amazon.';
  }
}
async function applyHistory(market){
  const cap = market === 'us' ? 'Us' : 'Br';
  const input = $('retDays' + cap), btn = $('retApply' + cap), statusEl = $('retStatus' + cap);
  const days = Number(input.value);
  if (!(days >= 0)){ toast('Dias precisa ser um número válido.', true); return; }
  btn.disabled = true;
  try{
    const pr = await fetch(`/api/amazon/history/preview?market=${market}&days=${days}`, { credentials:'same-origin' });
    const plan = await pr.json();
    if (!pr.ok) throw new Error(plan.error || 'falha ao calcular prévia');

    if (plan.action === 'prune' && plan.wouldDelete > 0){
      const ok = await cocoConfirm(
        `Isso vai apagar ${plan.wouldDelete.toLocaleString('pt-BR')} de ${plan.totalOrders.toLocaleString('pt-BR')} pedidos da Amazon ${RET_MARKET_LABEL[market]}, mantendo só os últimos ${days} dias. Essa ação não tem volta.`,
        { title: 'Apagar histórico antigo', confirmText: 'Apagar', danger: true }
      );
      if (!ok){ btn.disabled = false; return; }
    }

    const r = await fetch('/api/amazon/history', {
      method:'POST', credentials:'same-origin',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ market, days }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'http ' + r.status);

    if (d.action === 'pruned'){
      toast(`${d.deleted.toLocaleString('pt-BR')} pedidos apagados. Histórico agora: ${days === 0 ? 'sem limite' : days + ' dias'}.`);
      btn.disabled = false;
      loadHistory();
    } else if (d.action === 'backfill_started'){
      statusEl.textContent = 'Buscando o histórico que falta…';
      toast(`Buscando mais histórico da Amazon ${RET_MARKET_LABEL[market]}.`);
      pollHistoryBackfill(cap);
    } else {
      toast(`Configuração salva: ${days === 0 ? 'sem limite' : days + ' dias'}.`);
      btn.disabled = false;
    }
  }catch(e){
    toast('Erro: ' + (e.message || 'falha de rede'), true);
    btn.disabled = false;
  }
}
function pollHistoryBackfill(cap){
  if (retBackfillPolling) clearInterval(retBackfillPolling);
  const tick = async () => {
    try{
      const r = await fetch('/api/status', { credentials:'same-origin' });
      const d = await r.json();
      const b = d.amazon?.backfill;
      const statusEl = $('retStatus' + cap);
      if (!b || !statusEl) return;
      statusEl.textContent = b.status === 'running' ? `Buscando… ${b.message || ''}`
        : b.status === 'done' ? `Concluído: ${b.message || ''}`
        : b.status === 'error' ? `Erro: ${b.message || ''}`
        : '';
      if (b.status !== 'running'){
        clearInterval(retBackfillPolling);
        retBackfillPolling = null;
        $('retApply' + cap).disabled = false;
        if (b.status === 'done') loadHistory();
      }
    }catch(e){}
  };
  tick();
  retBackfillPolling = setInterval(tick, 4000);
}

// ── Backup do banco (Backblaze B2) — ver src/backup.js ────
function fmtBytes(n){
  if (!n) return '0 KB';
  return n > 1024*1024 ? (n/1024/1024).toFixed(1) + ' MB' : (n/1024).toFixed(0) + ' KB';
}
async function loadBackupStatus(){
  try{
    const r = await fetch('/api/backup/status', { credentials:'same-origin' });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'http ' + r.status);
    if (!d.configured){
      $('backupPanelSub').textContent = 'Não configurado — faltam B2_KEY_ID / B2_APPLICATION_KEY / B2_BUCKET_NAME nas variáveis do servidor.';
      $('backupRunBtn').disabled = true;
      return;
    }
    $('backupRunBtn').disabled = d.running;
    const last = d.last;
    $('backupPanelSub').textContent = !last ? 'Configurado, ainda sem nenhum backup rodado.'
      : last.status === 'done' ? `Último backup: ${new Date(last.finishedAt).toLocaleString('pt-BR')} · ${fmtBytes(last.sizeBytes)}${last.pruned ? ` · ${last.pruned} antigo(s) removido(s)` : ''}`
      : `Última tentativa falhou (${new Date(last.finishedAt).toLocaleString('pt-BR')}): ${last.message}`;
    $('backupFilesDivider').style.display = d.files.length ? '' : 'none';
    $('backupFilesList').innerHTML = d.files.slice(0, 10).map(f => `
      <div class="backup-file-row">
        <span class="backup-file-name">${escapeHtml(f.fileName.replace('db-backup/',''))}</span>
        <span>${fmtBytes(Number(f.sizeBytes))} · ${new Date(f.uploadedAt).toLocaleDateString('pt-BR')}</span>
      </div>`).join('');
  }catch(e){
    $('backupPanelSub').textContent = 'Não foi possível carregar o status do backup.';
  }
}
async function runBackupNow(){
  const btn = $('backupRunBtn');
  btn.disabled = true;
  $('backupStatusMsg').textContent = 'Rodando backup…';
  try{
    const r = await fetch('/api/backup/run', { method:'POST', credentials:'same-origin' });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'http ' + r.status);
    $('backupStatusMsg').textContent = `Backup concluído: ${fmtBytes(d.sizeBytes)}.`;
    toast('Backup concluído.');
    loadBackupStatus();
  }catch(e){
    $('backupStatusMsg').textContent = 'Erro: ' + (e.message || 'falha de rede');
    toast('Erro ao rodar backup: ' + (e.message || 'falha de rede'), true);
    btn.disabled = false;
  }
}

// ── Alerta de sincronização (Telegram) — ver src/alerts.js. Reaproveita GET /api/status
// (mesma checagem já usada pra Bling/Amazon/etc.) em vez de um endpoint só pra isso. ────
async function loadAlertsStatus(){
  try{
    const r = await fetch('/api/status', { credentials:'same-origin' });
    const d = await r.json();
    if (!r.ok) throw new Error('http ' + r.status);
    const configured = d.alerts?.configured;
    $('alertsTestBtn').disabled = !configured;
    $('alertsPanelSub').textContent = configured
      ? 'Configurado — avisa no Telegram quando um canal fica travado sem sincronizar por horas.'
      : 'Não configurado — faltam TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID nas variáveis do servidor.';
  }catch(e){
    $('alertsPanelSub').textContent = 'Não foi possível carregar o status do alerta.';
  }
}
async function testAlertNow(){
  const btn = $('alertsTestBtn');
  btn.disabled = true;
  $('alertsStatusMsg').textContent = 'Enviando…';
  try{
    const r = await fetch('/api/alerts/test', { method:'POST', credentials:'same-origin' });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'http ' + r.status);
    $('alertsStatusMsg').textContent = 'Enviado — confira o Telegram.';
    toast('Alerta de teste enviado.');
  }catch(e){
    $('alertsStatusMsg').textContent = 'Erro: ' + (e.message || 'falha de rede');
    toast('Erro ao enviar alerta: ' + (e.message || 'falha de rede'), true);
  }finally{
    btn.disabled = false;
  }
}

(async function(){
  syncViewSwitch();
  await loadMe();
  await load();
  await loadHistory();
  // Retoma o acompanhamento se uma busca de histórico já estava rodando antes de recarregar a
  // página (ex.: deu F5 no meio de um backfill).
  try{
    const s = await fetch('/api/status', { credentials:'same-origin' }).then(r => r.json());
    if (s.amazon?.backfill?.status === 'running'){
      const cap = s.amazon.backfill.market === 'us' ? 'Us' : 'Br';
      $('retApply' + cap).disabled = true;
      pollHistoryBackfill(cap);
    }
  }catch(e){}
  loadBackupStatus();
  loadAlertsStatus();
})();
