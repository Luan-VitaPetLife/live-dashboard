<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Vita Pet Life</title>
  <link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="css/anim.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" integrity="sha384-CK2SzKma4jA5H/MXDUU7i1TqZlCFaD4T01vtyDFvPlD97JQyS+IsSh1nI2EFbpyk" crossorigin="anonymous">
  <link rel="stylesheet" href="css/paginas/login.css">
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="img/marca/Logo2.png" alt="Vita Pet Life">
      <h1>Vita Pet Life</h1>
      <p>Painel de vendas</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Usuário</label>
        <div class="input-wrap">
          <input type="text" id="username" name="username" autocomplete="username" autofocus>
        </div>
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <div class="input-wrap pw-wrap">
          <input type="password" id="password" name="password" autocomplete="current-password">
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="Mostrar senha">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <div class="ok" id="loginOk"></div>
      <div class="err" id="err"></div>

      <button type="submit" id="submitBtn">Entrar</button>
      <button type="button" class="link-btn" id="forgotLink">Esqueci minha senha</button>
    </form>

    <!-- "Esqueci a senha": passo 1 pede o código, passo 2 (stepCode) troca a senha. -->
    <form id="forgotForm" hidden novalidate>
      <p class="help" id="forgotHelp">Digite seu usuário ou e-mail. Enviamos um código pro e-mail cadastrado.</p>
      <div class="field">
        <label for="fLogin">Usuário ou e-mail</label>
        <div class="input-wrap">
          <input type="text" id="fLogin" autocomplete="username">
        </div>
      </div>
      <div id="stepCode" class="step" hidden>
        <div class="field">
          <label for="fCode">Código</label>
          <div class="input-wrap">
            <input type="text" id="fCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
          </div>
        </div>
        <div class="field">
          <label for="fNew">Senha nova</label>
          <div class="input-wrap">
            <input type="password" id="fNew" autocomplete="new-password">
          </div>
        </div>
        <div class="field">
          <label for="fNew2">Repita a senha nova</label>
          <div class="input-wrap">
            <input type="password" id="fNew2" autocomplete="new-password">
          </div>
        </div>
      </div>

      <div class="ok" id="forgotOk"></div>
      <div class="err" id="forgotErr"></div>

      <button type="submit" id="forgotBtn">Enviar código</button>
      <button type="button" class="link-btn" id="resendLink" hidden>Não chegou? Enviar de novo</button>
      <button type="button" class="link-btn" id="backLink">Voltar pro login</button>
    </form>
  </div>

  <script src="js/paginas/login.js"></script>
</body>
</html>
